name: PayCore Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build, Format & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Spotless Code Formatting
        run: ./mvnw spotless:check

      - name: Compile and Run Unit & Integration Tests
        run: ./mvnw -B verify

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-and-failsafe-reports
          path: '**/target/*-reports/*.xml'

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/ops-console/package-lock.json'

      - name: Install Dependencies
        if: hashFiles('web/ops-console/package-lock.json') != ''
        run: cd web/ops-console && npm ci

      - name: Typecheck and Build
        if: hashFiles('web/ops-console/package-lock.json') != ''
        run: cd web/ops-console && npm run build
