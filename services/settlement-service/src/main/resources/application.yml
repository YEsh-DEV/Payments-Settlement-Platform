server:
  port: 8083

spring:
  application:
    name: settlement-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/settlement}
    username: ${SPRING_DATASOURCE_USERNAME:settlement_user}
    password: ${SPRING_DATASOURCE_PASSWORD:settlement_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: settlement-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

paycore:
  security:
    jwks-uri: ${PAYCORE_SECURITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  settlement:
    cutoff-cron: "0 0 * * * *" # Hourly cutoff
    provider: RAZORPAY_SIM

management:
  server:
    port: 9083
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
