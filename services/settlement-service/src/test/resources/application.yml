spring:
  application:
    name: settlement-service-test
  datasource:
    url: jdbc:postgresql://localhost:5432/settlement
    username: settlement_user
    password: settlement_dev_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

paycore:
  security:
    enabled: false
    jwks-uri: http://localhost:8081/.well-known/jwks.json
  settlement:
    cutoff-cron: "0 0 * * * *"
    provider: RAZORPAY_SIM
    kafka-topic: ledger.domain-events
    kafka-dlq-topic: ledger.domain-events.dlq
    ledger-url: http://localhost:8082
    identity-url: http://localhost:8081
    client-id: settlement-service
    client-secret: settlement_dev_secret
