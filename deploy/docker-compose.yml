services:
  postgres:
    image: postgres:16-alpine
    container_name: paycore-postgres
    restart: unless-stopped
    profiles: ["core", "obs", "perf"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paycore-redis
    restart: unless-stopped
    profiles: ["core", "obs", "perf"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: paycore-kafka
    restart: unless-stopped
    profiles: ["core", "obs", "perf"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: '4L622nShTUiT8YCdQU0Whw'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  identity-service:
    build:
      context: ../
      dockerfile: services/identity-service/Dockerfile
    container_name: paycore-identity
    restart: unless-stopped
    profiles: ["core", "obs", "perf"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity
      SPRING_DATASOURCE_USERNAME: identity_user
      SPRING_DATASOURCE_PASSWORD: identity_dev_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8081
    ports:
      - "8081:8081"

  ledger-service:
    build:
      context: ../
      dockerfile: services/ledger-service/Dockerfile
    container_name: paycore-ledger
    restart: unless-stopped
    profiles: ["core", "obs", "perf"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
      SPRING_DATASOURCE_USERNAME: ledger_user
      SPRING_DATASOURCE_PASSWORD: ledger_dev_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGER_POSTING_STRATEGY: STRIPED
      SERVER_PORT: 8082
    ports:
      - "8082:8082"

  settlement-service:
    build:
      context: ../
      dockerfile: services/settlement-service/Dockerfile
    container_name: paycore-settlement
    restart: unless-stopped
    profiles: ["core", "obs", "perf"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev,sim
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/settlement
      SPRING_DATASOURCE_USERNAME: settlement_user
      SPRING_DATASOURCE_PASSWORD: settlement_dev_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8083
    ports:
      - "8083:8083"

  ops-console:
    build:
      context: ../web/ops-console
      dockerfile: Dockerfile
    container_name: paycore-console
    restart: unless-stopped
    profiles: ["core", "obs", "perf"]
    depends_on:
      - identity-service
      - ledger-service
      - settlement-service
    ports:
      - "8080:8080"

volumes:
  postgres_data:
