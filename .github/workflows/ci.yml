name: PayCore Continuous Integration

on:
  push:
    branches: [ main, wp-backend-fix-2 ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Quality Gates & Verification
    runs-on: ubuntu-latest

    env:
      DOCKER_API_VERSION: '1.45'
      TESTCONTAINERS_RYUK_DISABLED: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_root_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize PostgreSQL Database-Per-Service Databases
        run: |
          docker cp deploy/postgres-init.sql ${{ job.services.postgres.id }}:/tmp/init.sql
          docker exec ${{ job.services.postgres.id }} psql -U postgres -f /tmp/init.sql

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Spotless Code Formatting
        run: ./mvnw -B spotless:check

      - name: Enforce Dependencies, SpotBugs, ArchUnit, Tests & JaCoCo Coverage
        run: ./mvnw -B verify -Dpaycore.test.use-host-services=true

      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/*.xml'

      - name: Archive JaCoCo Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: '**/target/site/jacoco/**'

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web/ops-console

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/ops-console/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Ops Console (Blocking with --max-warnings 0)
        run: npm run lint

      - name: Typecheck and Build Bundle
        run: npm run build

  docker:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Identity Service Image
        run: docker build -f services/identity-service/Dockerfile -t paycore-identity-service:ci .

      - name: Build Ledger Service Image
        run: docker build -f services/ledger-service/Dockerfile -t paycore-ledger-service:ci .

      - name: Build Settlement Service Image
        run: docker build -f services/settlement-service/Dockerfile -t paycore-settlement-service:ci .

      - name: Build Ops Console Image
        run: docker build -f web/ops-console/Dockerfile -t paycore-ops-console:ci web/ops-console

  security:
    name: Secret & Credential Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Uncommitted Secrets & Sensitive Tokens
        run: |
          echo "Scanning for potential committed credentials or private keys in working tree..."
          ! git grep -iE "(BEGIN PRIVATE KEY|AWS_SECRET_ACCESS_KEY|bearer [a-zA-Z0-9_\-\.]{50,})" -- ':!.github' ':!*.md' ':!*.json' ':!*src/test*' ':!docs/audit/evidence/*' ':!deploy/keys/*'
          echo "Scanning entire git commit history..."
          python3 scripts/scan-git-history-secrets.py
